name: contacts
# Builds data/contacts.json (official MP contacts: Sejm API, sejm.gov.pl, Wikidata) and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-sejm-contacts.mjs', '.github/workflows/contacts.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sejm-contacts.mjs
      - name: Commit contacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contacts.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update MP contacts"
          git pull --rebase
          git push
