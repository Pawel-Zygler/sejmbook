name: tests
on: [push, pull_request]
jobs:
  pyramid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run coverage          # unit tests + coverage thresholds
      - run: npm run test:integration
      # The runner's Microsoft apt source answers 403 (2026-11-27), which breaks apt-get update; Playwright needs only Ubuntu packages.
      - run: sudo find /etc/apt/sources.list.d -iname '*microsoft*' -delete
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
