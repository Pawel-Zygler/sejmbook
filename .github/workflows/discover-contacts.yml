name: discover-contacts
# One-off: prints where official MP contact data lives (log only, nothing is committed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover-contacts.mjs', '.github/workflows/discover-contacts.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/discover-contacts.mjs
