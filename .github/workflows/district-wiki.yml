name: district-wiki
# Dumps Polish Wikipedia articles about the 41 Sejm constituencies (data/raw/district-wiki.json) for the district map.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-district-wiki.mjs', '.github/workflows/district-wiki.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-district-wiki.mjs
      - name: Commit district articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/district-wiki.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Sejm constituency articles from Polish Wikipedia"
          git pull --rebase
          git push
