name: discover-feeds
# One-off: prints which official feeds can fill the home feed (log only).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover-feeds.mjs', '.github/workflows/discover-feeds.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/discover-feeds.mjs
