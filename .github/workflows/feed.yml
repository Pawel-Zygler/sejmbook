name: feed
# Builds data/feed.json (President, Prime Minister, Sejm votings) from official or verified sources and commits it.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths: ['scripts/fetch-feed.mjs', 'src/lib/feed.js', 'src/lib/feed-sources.js', '.github/workflows/feed.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-feed.mjs
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update home feed"
          git pull --rebase
          git push
