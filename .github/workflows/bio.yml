name: bio
# Dumps plwiki categories and Wikidata P39 of current MPs and officials (data/raw/bio-raw.json) and builds data/bio.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-bio.mjs', '.github/workflows/bio.yml']
  schedule:
    - cron: '40 4 * * 2'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-bio.mjs
      - run: if [ -f scripts/build-bio.mjs ]; then node scripts/build-bio.mjs; fi
      - name: Commit bio data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/bio-raw.json
          if [ -f data/bio.json ]; then git add data/bio.json; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update bio data (plwiki categories, Wikidata P39)"
          git pull --rebase
          git push
