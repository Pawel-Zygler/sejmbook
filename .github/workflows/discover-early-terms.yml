name: discover-early-terms
# One-off: prints where the MPs of Sejm terms I-II live on Polish Wikipedia (log only).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover-early-terms.mjs', '.github/workflows/discover-early-terms.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/discover-early-terms.mjs
