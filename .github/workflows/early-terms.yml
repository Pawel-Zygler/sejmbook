name: early-terms
# Saves the Wikipedia lists of MPs of terms I-II (data/raw/) and commits them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-early-terms.mjs']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-early-terms.mjs
      - name: Commit contacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Wikipedia lists of MPs for terms I-II"
          git pull --rebase
          git push
