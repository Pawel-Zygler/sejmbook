name: vote-tally
# Builds data/vote-tally.json (za / przeciw / wstrzymał się / nieobecny per MP over every X-term voting) from the Sejm API.
on:
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * 2'
  push:
    branches: [main, 'claude/**']
    paths: ['scripts/fetch-vote-tally.mjs', 'src/lib/vote-tally.js', '.github/workflows/vote-tally.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-vote-tally.mjs
      - name: Commit vote tally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vote-tally.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update za/przeciw tally per MP from the Sejm API"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
