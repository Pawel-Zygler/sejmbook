name: career
# Builds data/career.json (clubs of current MPs in every Sejm term) from the Sejm API and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-sejm-career.mjs', '.github/workflows/career.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sejm-career.mjs
      - name: Commit career data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/career.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update MP career (clubs per Sejm term) from the Sejm API"
          git pull --rebase
          git push
