name: life
# Builds data/life.json (party memberships with years) from Wikidata and the Sejm API and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-wikidata-life.mjs', '.github/workflows/life.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-wikidata-life.mjs
      - name: Commit career data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/life.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update MP party memberships from Wikidata"
          git pull --rebase
          git push
