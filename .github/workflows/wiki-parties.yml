name: wiki-parties
# Builds data/wiki-parties.json (party years from Polish Wikipedia infoboxes) and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-wikipedia-parties.mjs', 'src/lib/wikitext.js', '.github/workflows/wiki-parties.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-wikipedia-parties.mjs
      - name: Commit wiki parties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki-parties.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update MP party years from Polish Wikipedia"
          git pull --rebase
          git push
