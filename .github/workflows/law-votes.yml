name: law-votes
# Builds data/law-votes.json (every final vote on a whole law in the X term, per MP) from the Sejm API.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [main, 'claude/**']
    paths: ['scripts/fetch-law-votes.mjs', 'src/lib/law-votes.js', '.github/workflows/law-votes.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-law-votes.mjs
      - name: Commit law votes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/law-votes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update law votes per MP from the Sejm API"
          git pull --rebase
          git push
