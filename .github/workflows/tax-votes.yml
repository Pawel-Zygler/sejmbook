name: tax-votes
# Builds data/raw/tax-candidates.json and data/tax-votes.json (MP votes on tax raises/cuts) from the Sejm API.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['scripts/fetch-tax-votes.mjs', 'data/tax-classification.json', '.github/workflows/tax-votes.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-tax-votes.mjs
      - name: Commit tax votes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/tax-candidates.json data/tax-votes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update tax laws and MP votes from the Sejm API"
          git pull --rebase
          git push
